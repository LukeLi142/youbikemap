<body>
<div class="app">
 <header><div class="brand"><div class="brandmark" aria-hidden="true">Y</div><div><h1>臺北 YouBike 2.0</h1><small>臺北市公共自行車即時站點地圖</small></div></div><div class="header-status"><i class="live-dot" aria-hidden="true"></i><span>官方開放資料 · 每 60 秒更新</span></div></header>
 <main class="workspace">
  <aside class="sidebar" aria-label="站點查詢">
   <div class="controls">
    <p class="eyebrow">EXPLORE TAIPEI</p><h2>尋找附近的好騎點</h2><p class="sub">搜尋站名、地址或行政區，點選站點查看即時車位資訊。</p>
    <div class="searchbox"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/></svg><input id="search" type="search" autocomplete="off" placeholder="搜尋站點名稱或地址…" aria-label="搜尋站點名稱、地址或行政區"></div>
    <div class="filters"><select id="district" aria-label="選擇行政區"><option value="">所有行政區</option></select><select id="availability" aria-label="篩選可借車數"><option value="all">全部站點</option><option value="available">有車可借</option><option value="empty">無車可借</option></select><button class="refresh" id="refresh" type="button" title="立即更新資料">↻ 更新</button></div>
    <div class="stats"><div class="stat"><strong id="total">—</strong><span>符合條件站點</span></div><div class="stat"><strong id="bikes">—</strong><span>可借車輛</span></div><div class="stat"><strong id="docks">—</strong><span>可還車位</span></div></div>
    <div class="status-line"><span id="status" role="status" aria-live="polite">正在載入即時資訊…</span><span id="last-update">尚未更新</span></div>
   </div>
   <div class="results-head"><span>站點列表</span><span id="result-count">載入中</span></div><div class="results" id="results" aria-label="站點搜尋結果"></div>
  </aside>
  <section class="map-section" aria-label="臺北 YouBike 地圖"><div class="map" id="map"></div>
   <div class="map-overlay"><div class="legend" aria-label="地圖標記顏色圖例"><span><i style="background:#0b9773"></i>5 輛以上</span><span><i style="background:#edac35"></i>1–4 輛</span><span><i style="background:#df6262"></i>0 輛／停用</span></div><div class="map-tip">點選地圖上的圓點查看站點資訊</div></div>
   <div class="source">資料來源：<a href="https://data.gov.taipei/dataset/detail?id=c6bc8aed-557d-41d5-bfb1-8da24f78f2fb" target="_blank" rel="noopener noreferrer">臺北市政府交通局開放資料</a> · 地圖資料 © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap</a> · 圖磚 <a href="https://carto.com/attributions" target="_blank" rel="noopener noreferrer">CARTO</a></div>
   <div class="tile-warning" id="tile-warning" role="alert"></div>
   <div class="failure" id="failure" role="alert"><strong>目前無法取得即時資料</strong><div id="failure-message">請檢查網路連線後再試一次。</div><button id="retry" type="button">重新連線</button></div>
  </section>
 </main>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
'use strict';
(() => {
 const API = 'https://tcgbusfs.blob.core.windows.net/dotapp/youbike/v2/youbike_immediate.json';
 const $ = (id) => document.getElementById(id);
 const escapeHTML = (input) => String(input ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const number = (value) => value === null || value === undefined || value === '' ? NaN : Number(value);
 const validNumber = (value) => Number.isFinite(number(value));
 const colors = {good:'#0b9773',low:'#edac35',empty:'#df6262'};
 let map, layer, stations = [], markers = new Map(), busy = false, aborter = null, selectedId = null, loadedOnce = false;
 const supported = typeof window.L !== 'undefined';
 if (!supported) { $('status').textContent = '地圖套件載入失敗'; $('failure-message').textContent = 'Leaflet 地圖套件無法載入，請確認網路連線並重新開啟網頁。'; $('failure').classList.add('show'); return; }
 map = L.map('map', { zoomControl:false, preferCanvas:true }).setView([25.033,121.5654],13);
 L.control.zoom({position:'bottomright'}).addTo(map);
 // CARTO Voyager 是由 OpenStreetMap 資料製成的標準 raster 圖磚。
 // 使用 Leaflet 自己的 tileLayer，避免 MapLibre/Leaflet 雙引擎的座標同步問題。
 const tileTip = $('tile-warning');
 let tileErrors = 0;
 const baseLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
   subdomains: 'abcd', maxZoom: 19, minZoom: 3, tileSize: 256,
   attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
   crossOrigin: false,
   updateWhenIdle: true,
   keepBuffer: 3
 }).addTo(map);
 baseLayer.on('tileerror', () => {
   tileErrors++;
   if (tileErrors >= 3) {
     tileTip.textContent = '部分底圖載入失敗，請檢查網路連線或稍後重新整理。';
     tileTip.classList.add('show');
   }
 });
 baseLayer.on('load', () => { tileErrors = 0; tileTip.classList.remove('show'); });
 layer = L.layerGroup().addTo(map);
 const stationName = s => (s.name || '').replace(/^YouBike\s*2\.0[_\s]*/i,'').replace(/^YouBike2\.0[_\s]*/i,'');
 const stateOf = s => s.active === false || s.rent <= 0 ? 'empty' : s.rent < 5 ? 'low' : 'good';
 const iconFor = (s, selected = false) => L.divIcon({className:'',html:`<span class="marker-circle${selected?' selected':''}" style="background:${colors[stateOf(s)]}"></span>`,iconSize:selected?[24,24]:[19,19],iconAnchor:selected?[12,12]:[9.5,9.5]});
 function normalize(raw,index) {
   if (!raw || typeof raw !== 'object') return null;
   const lat = number(raw.latitude ?? raw.lat), lng = number(raw.longitude ?? raw.lng);
   if (!Number.isFinite(lat) || !Number.isFinite(lng) || lat<24.8 || lat>25.4 || lng<121.3 || lng>122) return null;
   const rent = number(raw.available_rent_bikes ?? raw.sbi);
   const docks = number(raw.available_return_bikes ?? raw.bemp);
   const act = String(raw.act ?? '1');
   return {id:String(raw.sno ?? `${lat}-${lng}-${index}`),name:String(raw.sna ?? raw.name ?? '未命名站點'),district:String(raw.sarea ?? ''),address:String(raw.ar ?? ''),rent:Number.isFinite(rent)?Math.max(0,rent):0,docks:Number.isFinite(docks)?Math.max(0,docks):0,lat,lng,updated:String(raw.mday ?? raw.infoTime ?? raw.srcUpdateTime ?? ''),active:act !== '0'};
 }
 function popupHTML(s){return `<div class="popup-title">${escapeHTML(stationName(s))}</div><div class="popup-region">${escapeHTML(s.district)} · ${s.active?'正常營運':'暫停營運'}</div><div class="popup-numbers"><div class="popup-number"><strong>${s.rent}</strong><span>可借車輛</span></div><div class="popup-number return"><strong>${s.docks}</strong><span>可還車位</span></div></div><div class="popup-address">地址：${escapeHTML(s.address || '未提供')}</div><div class="popup-update">站點資料時間：${escapeHTML(s.updated || '未提供')}</div>`;}
 function matches(s){const q=$('search').value.trim().toLocaleLowerCase('zh-Hant');const district=$('district').value;const availability=$('availability').value;return (!q || `${s.name} ${stationName(s)} ${s.address} ${s.district}`.toLocaleLowerCase('zh-Hant').includes(q)) && (!district || s.district===district) && (availability==='all' || (availability==='available'?s.active&&s.rent>0:!s.active||s.rent===0));}
 function updateDistricts(){const sel=$('district'),prev=sel.value;const values=[...new Set(stations.map(s=>s.district).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'zh-Hant'));sel.replaceChildren(new Option('所有行政區',''),...values.map(v=>new Option(v,v)));sel.value=values.includes(prev)?prev:'';}
 function selectStation(id){
   const marker = markers.get(id), s = stations.find(x => x.id === id);
   if (!marker || !s) return;
   if (selectedId && selectedId !== id && markers.has(selectedId)) {
     const oldStation = stations.find(x => x.id === selectedId);
     if (oldStation) markers.get(selectedId).setIcon(iconFor(oldStation));
   }
   selectedId = id;
   marker.setIcon(iconFor(s, true));
   // 停止前一次動畫，確保快速連續點擊不同站點不會導致定位錯亂。
   map.stop();
   // 先移動地圖，完成後再開啟 Popup，避免 Leaflet 自動平移使中心偏移。
   map.once('moveend', () => { if (selectedId === id) marker.openPopup(); });
   map.flyTo(marker.getLatLng(), Math.max(16, map.getZoom()), {duration: 0.65});
 }
 function render(){const filtered=stations.filter(matches);const visible=new Set(filtered.map(s=>s.id));for(const [id,marker] of markers){if(!visible.has(id)){layer.removeLayer(marker);markers.delete(id);}}
  for(const s of filtered){let marker=markers.get(s.id);if(!marker){marker=L.marker([s.lat,s.lng],{icon:iconFor(s,s.id===selectedId),title:stationName(s)}).addTo(layer);marker.on('click',()=>{selectStation(s.id);});markers.set(s.id,marker);}else{marker.setLatLng([s.lat,s.lng]);marker.setIcon(iconFor(s,s.id===selectedId));}marker.bindPopup(popupHTML(s),{maxWidth:280,autoPan:false});}
  $('total').textContent=filtered.length.toLocaleString('zh-TW');$('bikes').textContent=filtered.reduce((a,s)=>a+(s.active?s.rent:0),0).toLocaleString('zh-TW');$('docks').textContent=filtered.reduce((a,s)=>a+(s.active?s.docks:0),0).toLocaleString('zh-TW');$('result-count').textContent=`顯示前 ${Math.min(60,filtered.length)} / ${filtered.length} 站`;
  const results=$('results');results.replaceChildren();if(!filtered.length){results.innerHTML='<div class="no-results">找不到符合條件的站點。<br>請調整搜尋關鍵字或篩選條件。</div>';return;}
  const fragment=document.createDocumentFragment();for(const s of filtered.slice(0,60)){const button=document.createElement('button');button.type='button';button.className='station';button.setAttribute('aria-label',`${stationName(s)}，可借 ${s.rent} 輛，可還 ${s.docks} 格`);button.innerHTML=`<span class="pin" style="background:${colors[stateOf(s)]}"></span><span class="station-info"><strong>${escapeHTML(stationName(s))}</strong><span class="address">${escapeHTML(s.district)} · ${escapeHTML(s.address)}</span><span class="numbers"><span>可借 <b>${s.active?s.rent:0}</b></span><span>可還 <b>${s.active?s.docks:0}</b></span>${s.active?'':'<span>暫停營運</span>'}</span></span>`;button.addEventListener('click',()=>selectStation(s.id));fragment.appendChild(button);}results.appendChild(fragment);
 }
 async function fetchStations(){if(busy)return;busy=true;$('refresh').disabled=true;$('status').textContent='正在同步最新站點資料…';$('status').classList.remove('error');aborter=new AbortController();const timeout=setTimeout(()=>aborter.abort(),18000);
  try{const response=await fetch(API,{cache:'no-store',signal:aborter.signal});if(!response.ok)throw new Error(`API HTTP ${response.status}`);const json=await response.json();const rows=Array.isArray(json)?json:Array.isArray(json.data)?json.data:null;if(!rows)throw new Error('資料格式不符合預期');const normalized=rows.map(normalize).filter(Boolean);if(normalized.length===0)throw new Error('未取得有效站點座標');stations=normalized;updateDistricts();render();$('status').textContent=`即時資料已載入 · ${stations.length.toLocaleString('zh-TW')} 站`;$('last-update').textContent=new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit',hour12:false})+' 同步';$('failure').classList.remove('show');if(!loadedOnce){loadedOnce=true;}
  }catch(e){console.error('YouBike 資料更新失敗',e);$('status').textContent=stations.length?'連線失敗，顯示上次取得資料':'無法取得即時資料';$('status').classList.add('error');if(!stations.length){$('failure-message').textContent='無法連線到臺北市政府資料 API。請確認網路，或稍後重新嘗試。';$('failure').classList.add('show');} }
  finally{clearTimeout(timeout);busy=false;$('refresh').disabled=false;aborter=null;}
 }
 let debounce; $('search').addEventListener('input',()=>{clearTimeout(debounce);debounce=setTimeout(render,180);});$('district').addEventListener('change',render);$('availability').addEventListener('change',render);$('refresh').addEventListener('click',fetchStations);$('retry').addEventListener('click',fetchStations);
 fetchStations();setInterval(()=>{if(!document.hidden)fetchStations();},60_000);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&stations.length)fetchStations();});
